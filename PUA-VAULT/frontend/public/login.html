<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PUA Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            milk: '#FDFFF5',
                            green: '#2E7D32',
                            darkgreen: '#1B5E20',
                            accent: '#00C853',
                            dark: '#0A1F0D'
                        }
                    },
                    fontFamily: { sans: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-brand-milk font-sans antialiased min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 mb-6">
                <img src="assets/img/pua-logo.jpg" alt="PUA Logo" class="w-10 h-10 rounded-full object-cover shadow-lg">
                <span class="font-extrabold text-2xl tracking-tight text-brand-dark">PUA Vault</span>
            </a>
            <h1 class="text-3xl font-extrabold text-brand-dark">Admin Login</h1>
            <p class="text-gray-500 mt-2">Sign in with your admin account</p>
        </div>

        <div class="bg-white rounded-2xl p-8 shadow-lg border border-gray-100">
            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" name="email" required class="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:ring-2 focus:ring-brand-green focus:border-brand-green outline-none transition-all" placeholder="you@phoenixuniversity.edu.ng">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-3 border border-gray-200 rounded-xl bg-gray-50 focus:ring-2 focus:ring-brand-green focus:border-brand-green outline-none transition-all" placeholder="Your password">
                </div>
                <button type="submit" class="w-full bg-brand-green hover:bg-brand-darkgreen text-white py-3.5 rounded-xl font-semibold transition-all shadow-md flex items-center justify-center gap-2">
                    Sign In <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-100 text-center">
                <a href="index.html" class="text-sm text-gray-500 hover:text-brand-green transition-colors">
                    <i class="ph-bold ph-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
